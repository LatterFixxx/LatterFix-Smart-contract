[package]
name = "latterfix-smart-contract"
version = "0.2.0"
edition = "2021"
authors = ["LatterFix Team"]
description = "Decentralized task management protocol with escrow, governance, and reputation system on Stellar/Soroban"
license = "MIT"
repository = "https://github.com/LatterFixxx/LatterFix-Smart-contract"
readme = "README.md"
keywords = ["stellar", "soroban", "smart-contract", "task-management", "escrow"]
categories = ["cryptography::cryptocurrencies", "wasm"]

[lib]
name = "task_manager_pro"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.7.0"

[dev-dependencies]
soroban-sdk = { version = "21.7.0", features = ["testutils"] }
# Used only by tests to produce real Ed25519 signatures for the gasless
# assignment path; already in the lock graph via soroban-sdk testutils.
ed25519-dalek = "2"

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[profile.release]
opt-level = "z"
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
debug = true

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
